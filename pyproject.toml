[project]
name = "openevalz-eval-paperbench"
version = "0.1.0"
description = "OpenEvalz packaging of PaperBench: Evaluating AI's Ability to Replicate AI Research (Work In Progress)"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "paperbench"
execution_class = "sandbox-local"
cost_class = "high"
